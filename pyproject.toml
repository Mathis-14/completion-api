[project]
name = "completion-api"
version = "0.1.0"
description = "API de completion multi-provider avec FastAPI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.7.0",
    "fastapi>=0.141.1",
    "mistralai>=2.10.1",
    "openai>=3.16.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
]
